<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0c10">
<title>Renewal Radar — Gym</title>
<script>
  /* Resolve the theme before first paint so there is no flash. */
  (function(){
    var t;
    try { t = localStorage.getItem("rr_theme"); } catch(e){}
    if (t !== "light" && t !== "dark") {
      t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
    }
    document.documentElement.setAttribute("data-theme", t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", t === "light" ? "#f2f4f8" : "#0a0c10");
  })();
</script>
<style>
  /* ============================================================
     Renewal Radar — theme tokens
     Every colour below reads from these, so switching theme is
     a single attribute on <html>. Dark is the default.
     ============================================================ */
  :root,
  [data-theme="dark"]{
    color-scheme:dark;

    --bg:#0a0c10;
    --glow-1:rgba(91,157,255,.13);
    --glow-2:rgba(167,139,250,.11);
    --glow-3:rgba(61,220,132,.05);

    /* raised surfaces */
    --card-t:rgba(255,255,255,.055);
    --card-b:rgba(255,255,255,.018);
    --card-t-2:rgba(255,255,255,.045);
    --surface:rgba(255,255,255,.032);
    --surface-2:rgba(255,255,255,.055);
    --surface-3:rgba(255,255,255,.085);
    --line:rgba(255,255,255,.075);
    --line-2:rgba(255,255,255,.12);
    --sheen:rgba(255,255,255,.05);
    --sheen-2:rgba(255,255,255,.07);
    --hairline:rgba(255,255,255,.055);

    /* text */
    --txt:#f1f3f7;
    --dim:#98a1b3;
    --dim2:#737d8b;

    /* status */
    --red:#f0555f;    --red-soft:#ff8a92;   --red-bg:rgba(240,85,95,.12);    --red-line:rgba(240,85,95,.32);
    --amber:#f0a63c;  --amber-soft:#ffc978; --amber-bg:rgba(240,166,60,.12); --amber-line:rgba(240,166,60,.32);
    --green:#3ddc84;  --green-soft:#7ceea9; --green-bg:rgba(61,220,132,.11); --green-line:rgba(61,220,132,.30);
    --blue:#5b9dff;   --blue-soft:#9cc4ff;  --blue-bg:rgba(91,157,255,.12);  --blue-line:rgba(91,157,255,.32);
    --violet:#a78bfa; --violet-soft:#c9baff;--violet-bg:rgba(167,139,250,.12);--violet-line:rgba(167,139,250,.30);
    --note-bg:rgba(255,255,255,.05);   --note-line:rgba(255,255,255,.11);

    --num-glow-red:0 0 26px rgba(240,85,95,.35);
    --num-glow-amber:0 0 26px rgba(240,166,60,.32);
    --num-glow-green:0 0 26px rgba(61,220,132,.28);
    --num-glow-blue:0 0 26px rgba(91,157,255,.3);
    --sub-red:rgba(255,138,146,.8);
    --sub-amber:rgba(255,201,120,.8);
    --sub-green:rgba(124,238,169,.78);
    --sub-blue:rgba(156,196,255,.78);
    --bloom-scale:1;

    /* controls */
    --input-bg:rgba(0,0,0,.28);
    --input-bg-focus:rgba(0,0,0,.36);
    --inset:inset 0 1px 2px rgba(0,0,0,.35);
    --track-bg:rgba(255,255,255,.04);
    --track-inset:inset 0 1px 2px rgba(0,0,0,.3);
    --seg-a:#ffffff;      --seg-b:#dfe5ef;      --seg-txt:#0a0c10;
    --seg-shadow:0 2px 10px -2px rgba(0,0,0,.5), inset 0 1px 0 #fff;

    /* row action tints */
    --wa-a:rgba(61,220,132,.20);  --wa-b:rgba(61,220,132,.11);
    --wa-a-h:rgba(61,220,132,.30);--wa-b-h:rgba(61,220,132,.16);
    --rn-a:rgba(91,157,255,.22);  --rn-b:rgba(91,157,255,.11);
    --rn-a-h:rgba(91,157,255,.32);--rn-b-h:rgba(91,157,255,.17);

    /* overlays */
    --overlay:rgba(4,6,10,.72);
    --sheet-a:#171b23;    --sheet-b:#0f1319;
    --grabber:rgba(255,255,255,.18);
    --dashed:rgba(255,255,255,.16);
    --dashed-soft:rgba(255,255,255,.09);
    --dotline:rgba(255,255,255,.18);
    --dotline-hover:rgba(255,255,255,.4);
    --on-accent:#ffffff;

    /* elevation */
    --shadow-1:0 1px 2px rgba(0,0,0,.35);
    --shadow-2:0 6px 20px -6px rgba(0,0,0,.55);
    --shadow-3:0 26px 70px -18px rgba(0,0,0,.8);
    --btn-shadow:inset 0 1px 0 rgba(255,255,255,.055), 0 1px 2px rgba(0,0,0,.25);
    --toast-shadow:0 18px 44px -14px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.08);

    --r-sm:9px; --r:13px; --r-lg:18px;
    --ease:cubic-bezier(.22,.68,.32,1);
  }

  [data-theme="light"]{
    color-scheme:light;

    --bg:#f2f4f8;
    --glow-1:rgba(91,157,255,.16);
    --glow-2:rgba(167,139,250,.14);
    --glow-3:rgba(61,220,132,.08);

    --card-t:rgba(255,255,255,.99);
    --card-b:rgba(255,255,255,.84);
    --card-t-2:rgba(255,255,255,.92);
    --surface:rgba(15,20,30,.03);
    --surface-2:rgba(15,20,30,.045);
    --surface-3:rgba(15,20,30,.075);
    --line:rgba(15,20,30,.10);
    --line-2:rgba(15,20,30,.18);
    --sheen:rgba(255,255,255,.9);
    --sheen-2:rgba(255,255,255,1);
    --hairline:rgba(15,20,30,.075);

    --txt:#10141c;
    --dim:#525c6e;
    --dim2:#5f6a7c;

    --red:#d92d3a;    --red-soft:#b81f2c;   --red-bg:rgba(217,45,58,.10);   --red-line:rgba(217,45,58,.28);
    --amber:#b06f05;  --amber-soft:#8f5900; --amber-bg:rgba(214,140,15,.13);--amber-line:rgba(176,111,5,.30);
    --green:#0f9250;  --green-soft:#0a6b3a; --green-bg:rgba(15,146,80,.11); --green-line:rgba(15,146,80,.28);
    --blue:#2563eb;   --blue-soft:#1a4fc4;  --blue-bg:rgba(37,99,235,.10);  --blue-line:rgba(37,99,235,.28);
    --violet:#7c5cd6; --violet-soft:#5f42b8;--violet-bg:rgba(124,92,214,.11);--violet-line:rgba(124,92,214,.28);
    --note-bg:rgba(15,20,30,.035);     --note-line:rgba(15,20,30,.10);

    --num-glow-red:none;
    --num-glow-amber:none;
    --num-glow-green:none;
    --num-glow-blue:none;
    --sub-red:rgba(184,31,44,.92);
    --sub-amber:rgba(143,89,0,.92);
    --sub-green:rgba(10,107,58,.92);
    --sub-blue:rgba(26,79,196,.92);
    --bloom-scale:.5;

    --input-bg:#ffffff;
    --input-bg-focus:#ffffff;
    --inset:inset 0 1px 2px rgba(15,20,30,.06);
    --track-bg:rgba(15,20,30,.045);
    --track-inset:inset 0 1px 2px rgba(15,20,30,.05);
    --seg-a:#ffffff;      --seg-b:#f2f5fa;      --seg-txt:#10141c;
    --seg-shadow:0 1px 3px rgba(15,20,30,.16), 0 1px 1px rgba(15,20,30,.06);

    --wa-a:rgba(15,146,80,.13);   --wa-b:rgba(15,146,80,.07);
    --wa-a-h:rgba(15,146,80,.20); --wa-b-h:rgba(15,146,80,.11);
    --rn-a:rgba(37,99,235,.13);   --rn-b:rgba(37,99,235,.07);
    --rn-a-h:rgba(37,99,235,.20); --rn-b-h:rgba(37,99,235,.11);

    --overlay:rgba(18,24,36,.40);
    --sheet-a:#ffffff;    --sheet-b:#f7f9fc;
    --grabber:rgba(15,20,30,.18);
    --dashed:rgba(15,20,30,.18);
    --dashed-soft:rgba(15,20,30,.10);
    --dotline:rgba(15,20,30,.22);
    --dotline-hover:rgba(15,20,30,.45);
    --on-accent:#ffffff;

    --shadow-1:0 1px 2px rgba(15,20,30,.06);
    --shadow-2:0 8px 24px -8px rgba(15,20,30,.18);
    --shadow-3:0 30px 70px -20px rgba(15,20,30,.3);
    --btn-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 1px 2px rgba(15,20,30,.07);
    --toast-shadow:0 18px 44px -14px rgba(15,20,30,.28), inset 0 1px 0 rgba(255,255,255,.9);

    --r-sm:9px; --r:13px; --r-lg:18px;
    --ease:cubic-bezier(.22,.68,.32,1);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}

  body{
    margin:0;
    color:var(--txt);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",Roboto,"Noto Sans",sans-serif;
    font-size:16px;
    line-height:1.5;
    letter-spacing:-.011em;
    padding-bottom:56px;
    background:var(--bg);
    background-image:
      radial-gradient(720px 420px at 12% -8%,  var(--glow-1), transparent 70%),
      radial-gradient(680px 400px at 92% -4%,  var(--glow-2), transparent 68%),
      radial-gradient(900px 520px at 50% 108%, var(--glow-3), transparent 72%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    transition:background-color .3s var(--ease), color .3s var(--ease);
  }

  .wrap{max-width:920px;margin:0 auto;padding:22px 18px}

  /* ---------------- header ---------------- */
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 20px}
  .brand{display:flex;align-items:center;gap:12px;flex:1 1 auto;min-width:0}
  .brandtext{display:flex;flex-direction:column;align-items:flex-start;min-width:0;flex:1 1 auto}
  .dot-logo{
    width:38px;height:38px;border-radius:11px;flex:0 0 auto;
    display:grid;place-items:center;font-size:17px;
    background:linear-gradient(150deg,#5b9dff,#a78bfa 62%,#f0555f 130%);
    box-shadow:0 6px 18px -6px rgba(91,157,255,.7), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .brand h1{
    font-size:17px;margin:0;font-weight:680;
    letter-spacing:-.024em;line-height:1.2;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  /* the gym name is a real control — it reads as text until you hover it */
  .gymbtn{
    display:flex;align-items:center;gap:7px;
    width:fit-content;max-width:100%;
    margin:2px 0 0 -7px;padding:3px 7px;
    border:1px solid transparent;border-radius:8px;
    background:none;
    color:var(--dim);
    font-family:inherit;
    font-size:14.5px;font-weight:600;
    letter-spacing:-.012em;line-height:1.35;
    text-align:left;
    cursor:pointer;
    transition:color .16s var(--ease), background .16s var(--ease), border-color .16s var(--ease);
  }
  .gymbtn:hover{color:var(--txt);background:var(--surface-2);border-color:var(--line)}
  .gymbtn:active{transform:scale(.985)}
  .gymbtn .gymname{
    min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .gymbtn .gpencil{
    width:12px;height:12px;flex:0 0 auto;
    opacity:0;transition:opacity .16s var(--ease);
  }
  .gymbtn:hover .gpencil,
  .gymbtn:focus-visible .gpencil{opacity:.8}

  /* ---------------- theme toggle ---------------- */
  .themebtn{
    width:38px;height:38px;flex:0 0 auto;
    display:grid;place-items:center;
    border-radius:11px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--dim);
    cursor:pointer;
    box-shadow:var(--btn-shadow);
    transition:background .18s var(--ease), color .18s var(--ease),
               border-color .18s var(--ease), transform .14s var(--ease);
  }
  .themebtn:hover{color:var(--txt);border-color:var(--line-2);background:var(--surface-3)}
  .themebtn:active{transform:scale(.94)}
  .themebtn svg{width:17px;height:17px;display:block;grid-area:1/1}
  .themebtn .i-sun{display:none}
  .themebtn .i-moon{display:block}
  [data-theme="light"] .themebtn .i-sun{display:block}
  [data-theme="light"] .themebtn .i-moon{display:none}

  /* ---------------- stats ---------------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:20px}
  .stat{
    position:relative;overflow:hidden;
    padding:15px 15px 14px;
    border-radius:var(--r-lg);
    background:linear-gradient(180deg, var(--card-t), var(--card-b));
    border:1px solid var(--line);
    box-shadow:var(--shadow-1), inset 0 1px 0 var(--sheen);
    transition:transform .22s var(--ease), border-color .22s var(--ease), box-shadow .22s var(--ease);
  }
  .stat:hover{
    transform:translateY(-2px);
    border-color:var(--line-2);
    box-shadow:var(--shadow-2), inset 0 1px 0 var(--sheen-2);
  }
  /* coloured hairline along the top edge */
  .stat::before{
    content:"";position:absolute;left:14px;right:14px;top:0;height:2px;
    border-radius:0 0 2px 2px;background:var(--dim2);opacity:.85;
  }
  /* soft tinted bloom behind the number */
  .stat::after{
    content:"";position:absolute;inset:auto -30% -70% auto;width:150px;height:150px;
    border-radius:50%;background:var(--dim2);opacity:.07;filter:blur(24px);
    pointer-events:none;
  }
  .stat.red::before,.stat.red::after{background:var(--red)}
  .stat.amber::before,.stat.amber::after{background:var(--amber)}
  .stat.green::before,.stat.green::after{background:var(--green)}
  .stat.blue::before,.stat.blue::after{background:var(--blue)}
  .stat.red::after{opacity:calc(.16 * var(--bloom-scale))}
  .stat.amber::after{opacity:calc(.14 * var(--bloom-scale))}
  .stat.green::after{opacity:calc(.12 * var(--bloom-scale))}
  .stat.blue::after{opacity:calc(.13 * var(--bloom-scale))}

  .stat .n{
    font-size:27px;font-weight:720;line-height:1.1;
    letter-spacing:-.035em;
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
  }
  .stat .l{
    font-size:11px;color:var(--dim);margin-top:5px;
    font-weight:640;letter-spacing:.055em;text-transform:uppercase;
  }
  .stat .sub{
    font-size:11.5px;margin-top:9px;font-weight:640;
    color:var(--dim2);letter-spacing:-.005em;
  }
  .stat.red   .n{color:var(--red-soft);  text-shadow:var(--num-glow-red)}
  .stat.amber .n{color:var(--amber-soft);text-shadow:var(--num-glow-amber)}
  .stat.green .n{color:var(--green-soft);text-shadow:var(--num-glow-green)}
  .stat.blue  .n{color:var(--blue-soft); text-shadow:var(--num-glow-blue)}
  .stat.red   .sub{color:var(--sub-red)}
  .stat.amber .sub{color:var(--sub-amber)}
  .stat.green .sub{color:var(--sub-green)}
  .stat.blue  .sub{color:var(--sub-blue)}

  /* ---------------- control row: search + sort ---------------- */
  .filterrow{
    display:flex;align-items:center;gap:9px;
    margin-bottom:13px;
  }

  /* ---------------- tabs ---------------- */
  .tabs{
    display:flex;gap:4px;padding:4px;
    overflow-x:auto;scrollbar-width:none;
    border-radius:99px;
    background:var(--track-bg);
    border:1px solid var(--line);
    box-shadow:var(--track-inset);
    margin-bottom:15px;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;
    border:none;background:transparent;
    color:var(--dim);
    padding:8px 15px;border-radius:99px;
    font-family:inherit;font-size:13px;font-weight:620;
    letter-spacing:-.005em;
    cursor:pointer;white-space:nowrap;
    transition:color .18s var(--ease), background .18s var(--ease), box-shadow .18s var(--ease);
  }
  .tab:hover{color:var(--txt);background:var(--surface-2)}
  .tab.active{
    color:var(--seg-txt);
    background:linear-gradient(180deg,var(--seg-a),var(--seg-b));
    box-shadow:var(--seg-shadow);
  }
  .tab .cnt{
    display:inline-block;margin-left:5px;
    font-weight:600;font-variant-numeric:tabular-nums;
    opacity:.48;
  }
  .tab.active .cnt{opacity:.62}

  /* sort control */
  .sortbtn{
    display:inline-flex;align-items:center;gap:6px;
    flex:0 0 auto;
    height:34px;padding:0 12px;
    border-radius:99px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--dim);
    font-family:inherit;font-size:12.5px;font-weight:630;
    letter-spacing:-.005em;
    cursor:pointer;white-space:nowrap;
    box-shadow:var(--btn-shadow);
    transition:background .17s var(--ease), color .17s var(--ease),
               border-color .17s var(--ease), transform .14s var(--ease);
  }
  .sortbtn:hover{color:var(--txt);background:var(--surface-3);border-color:var(--line-2)}
  .sortbtn:active{transform:scale(.965)}
  .sortbtn svg{width:13px;height:13px;flex:0 0 auto;opacity:.85}
  .sortbtn .arrow{font-size:10px;opacity:.6;margin-left:-3px}
  /* the two stacked arrows swap emphasis with the mode */
  .sortbtn[data-mode="urgency"] .up,
  .sortbtn[data-mode="za"] .down{opacity:.28}
  .sortbtn[data-mode="az"] .down{opacity:.28}

  /* ---------------- list ---------------- */
  .list{display:flex;flex-direction:column;gap:10px}

  .row{
    position:relative;
    padding:14px 16px;
    border-radius:var(--r-lg);
    background:linear-gradient(180deg, var(--card-t-2), var(--card-b));
    border:1px solid var(--line);
    box-shadow:var(--shadow-1), inset 0 1px 0 var(--sheen);
    transition:transform .2s var(--ease), border-color .2s var(--ease), box-shadow .2s var(--ease);
    animation:rowIn .28s var(--ease) both;
  }
  .row:hover{
    transform:translateY(-1px);
    border-color:var(--line-2);
    box-shadow:var(--shadow-2), inset 0 1px 0 var(--sheen-2);
  }
  @keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* status is carried by a left edge accent, not a heavy background */
  .row.lapsed{
    border-color:var(--red-line);
    background:linear-gradient(180deg, var(--red-bg), var(--card-b) 170%);
  }
  .row.lapsed::before{
    content:"";position:absolute;left:0;top:13px;bottom:13px;width:3px;
    border-radius:0 3px 3px 0;background:var(--red);
    box-shadow:0 0 14px var(--red-line);
  }
  .row.expiring{
    border-color:var(--amber-line);
    background:linear-gradient(180deg, var(--amber-bg), var(--card-b) 170%);
  }
  .row.expiring::before{
    content:"";position:absolute;left:0;top:13px;bottom:13px;width:3px;
    border-radius:0 3px 3px 0;background:var(--amber);
    box-shadow:0 0 14px var(--amber-line);
  }
  .row.left{opacity:.55;filter:saturate(.5)}
  .row.left:hover{opacity:.8}

  .r-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .r-name{
    font-weight:670;font-size:15.5px;
    letter-spacing:-.018em;line-height:1.3;
  }

  /* flagged members get a gold star before the name */
  .flagstar{
    display:inline-block;vertical-align:-2px;
    margin-right:5px;
    font-size:13px;line-height:1;
    color:var(--amber);
    filter:drop-shadow(0 0 6px var(--amber-line));
  }
  .r-meta{
    font-size:12.5px;color:var(--dim);margin-top:3px;
    font-variant-numeric:tabular-nums;letter-spacing:0;
  }
  .r-meta .sep{opacity:.28;margin:0 7px}

  /* ---------------- pills ---------------- */
  .pill{
    display:inline-flex;align-items:center;
    font-size:10.5px;font-weight:700;
    padding:4px 9px;border-radius:99px;
    white-space:nowrap;
    letter-spacing:.045em;text-transform:uppercase;
    border:1px solid transparent;
    font-variant-numeric:tabular-nums;
  }
  .pill.lapsed  {background:var(--red-bg);  color:var(--red-soft);  border-color:var(--red-line)}
  .pill.expiring{background:var(--amber-bg);color:var(--amber-soft);border-color:var(--amber-line)}
  .pill.active  {background:var(--green-bg);color:var(--green-soft);border-color:var(--green-line)}
  .pill.left    {background:var(--surface-2);color:var(--dim);border-color:var(--line)}
  .pill.pt      {background:var(--violet-bg);color:var(--violet-soft);border-color:var(--violet-line)}

  /* ---------------- row actions ---------------- */
  .r-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

  button.act{
    display:inline-flex;align-items:center;gap:6px;
    padding:9px 14px;border-radius:10px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--txt);
    font-family:inherit;font-size:13px;font-weight:630;
    letter-spacing:-.005em;
    cursor:pointer;
    box-shadow:var(--btn-shadow);
    transition:transform .14s var(--ease), background .18s var(--ease),
               border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  button.act:hover{background:var(--surface-3);border-color:var(--line-2)}
  button.act:active{transform:scale(.972)}

  button.act.wa{
    background:linear-gradient(180deg, var(--wa-a), var(--wa-b));
    border-color:var(--green-line);
    color:var(--green-soft);
  }
  button.act.wa:hover{
    background:linear-gradient(180deg, var(--wa-a-h), var(--wa-b-h));
    box-shadow:0 0 0 3px var(--green-bg), inset 0 1px 0 var(--sheen-2);
  }

  button.act.renew{
    background:linear-gradient(180deg, var(--rn-a), var(--rn-b));
    border-color:var(--blue-line);
    color:var(--blue-soft);
  }
  button.act.renew:hover{
    background:linear-gradient(180deg, var(--rn-a-h), var(--rn-b-h));
    box-shadow:0 0 0 3px var(--blue-bg), inset 0 1px 0 var(--sheen-2);
  }

  .r-rem{
    font-size:11.5px;color:var(--dim2);margin-top:10px;
    letter-spacing:.005em;
  }

  /* ---------------- member note ---------------- */
  .r-note{
    display:flex;align-items:flex-start;gap:8px;
    width:100%;margin-top:11px;padding:9px 11px;
    text-align:left;
    border-radius:10px;
    border:1px solid var(--note-line);
    background:var(--note-bg);
    color:var(--txt);
    font-family:inherit;font-size:12.5px;line-height:1.55;
    letter-spacing:-.003em;
    cursor:pointer;
    transition:background .16s var(--ease), border-color .16s var(--ease);
  }
  .r-note:hover{background:var(--surface-3);border-color:var(--line-2)}
  .r-note .nicon{
    flex:0 0 auto;font-size:11px;line-height:1.7;
    color:var(--dim2);
  }
  .r-note .ntext{
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:3;
    line-clamp:3;
    overflow:hidden;
    word-break:break-word;
  }
  .r-note:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  /* ---------------- row secondary actions ---------------- */
  .r-sub{
    display:flex;gap:16px;row-gap:9px;flex-wrap:wrap;
    margin-top:11px;padding-top:10px;
    border-top:1px solid var(--hairline);
  }
  .mini{
    background:none;border:none;padding:0;
    color:var(--dim2);
    font-family:inherit;font-size:12px;font-weight:620;
    letter-spacing:.005em;
    cursor:pointer;
    transition:color .16s var(--ease);
  }
  .mini:hover{color:var(--txt)}
  .mini.danger:hover{color:var(--red-soft)}

  /* flag toggle in the secondary action row */
  .mini.isflag{color:var(--amber-soft)}
  .mini.isflag:hover{color:var(--amber)}
  .mini .mstar{margin-right:4px;font-size:11px}

  /* note toggle — blue whenever a note exists */
  .mini.isnote{color:var(--blue-soft)}
  .mini.isnote:hover{color:var(--blue)}
  .mini .npend{margin-right:4px;font-size:11px}

  .fclose.danger:hover{color:var(--red-soft);background:var(--red-bg)}
  .note-area{min-height:118px}

  /* ---------------- search ---------------- */
  .searchbar{position:relative;flex:1;min-width:0}
  .searchbar input{
    padding-left:40px;padding-right:38px;
    height:44px;
    border-radius:12px;
  }
  .searchbar .ic{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    color:var(--dim2);font-size:13px;pointer-events:none;
    opacity:.85;
  }
  .searchbar .clr{
    position:absolute;right:7px;top:50%;transform:translateY(-50%);
    width:28px;height:28px;border-radius:8px;
    display:none;place-items:center;
    background:var(--surface-2);border:1px solid var(--line);
    color:var(--dim);font-size:15px;line-height:1;
    cursor:pointer;font-family:inherit;
    transition:background .16s var(--ease), color .16s var(--ease);
  }
  .searchbar.has .clr{display:grid}
  .searchbar .clr:hover{background:var(--surface-3);color:var(--txt)}

  /* ---------------- inputs ---------------- */
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  label{
    display:block;margin-bottom:6px;
    font-size:10.5px;font-weight:680;
    letter-spacing:.06em;text-transform:uppercase;
    color:var(--dim2);
  }
  input,select{
    width:100%;
    padding:11px 13px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--input-bg);
    color:var(--txt);
    font-family:inherit;font-size:15px;font-weight:500;
    letter-spacing:-.005em;
    box-shadow:var(--inset);
    transition:border-color .16s var(--ease), box-shadow .16s var(--ease), background .16s var(--ease);
    appearance:none;
  }
  input::placeholder{color:var(--dim2);opacity:.75}
  input:hover,select:hover{border-color:var(--line-2)}
  input:focus,select:focus,textarea:focus{
    outline:none;
    border-color:var(--blue);
    background:var(--input-bg-focus);
    box-shadow:var(--inset), 0 0 0 3px var(--blue-bg);
  }
  select{
    background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),
                     linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 18px) calc(50% - 2px), calc(100% - 13px) calc(50% - 2px);
    background-size:5px 5px,5px 5px;
    background-repeat:no-repeat;
    padding-right:36px;
  }

  textarea{
    width:100%;min-height:136px;resize:vertical;
    padding:12px 13px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--input-bg);
    color:var(--txt);
    font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    font-size:13px;line-height:1.7;
    box-shadow:var(--inset);
    transition:border-color .16s var(--ease), box-shadow .16s var(--ease);
  }

  /* ---------------- primary / ghost buttons ---------------- */
  .fsave{
    width:100%;margin-top:15px;padding:13px;
    border-radius:11px;border:none;
    background:linear-gradient(180deg,#6fabff,#3f86ff);
    color:var(--on-accent);
    font-family:inherit;font-size:15px;font-weight:680;
    letter-spacing:-.01em;
    cursor:pointer;
    box-shadow:0 8px 22px -8px rgba(63,134,255,.85), inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .14s var(--ease), box-shadow .2s var(--ease), filter .2s var(--ease);
  }
  .fsave:hover{filter:brightness(1.06);box-shadow:0 10px 28px -8px rgba(63,134,255,1), inset 0 1px 0 rgba(255,255,255,.4)}
  .fsave:active{transform:scale(.985)}

  .fclose{
    width:100%;margin-top:10px;padding:9px;
    background:none;border:none;
    color:var(--dim2);
    font-family:inherit;font-size:13px;font-weight:600;
    cursor:pointer;border-radius:9px;
    transition:color .16s var(--ease), background .16s var(--ease);
  }
  .fclose:hover{color:var(--txt);background:var(--surface)}

  /* ---------------- add / import buttons ---------------- */
  .addrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .addbtn{
    margin:0;padding:14px;
    width:100%;
    border-radius:var(--r);
    border:1px dashed var(--dashed);
    background:var(--surface);
    color:var(--dim);
    font-family:inherit;font-size:14px;font-weight:640;
    letter-spacing:-.005em;
    cursor:pointer;
    transition:color .18s var(--ease), border-color .18s var(--ease),
               background .18s var(--ease), transform .14s var(--ease);
  }
  .addbtn:hover{
    color:var(--txt);
    border-color:var(--blue-line);
    background:var(--blue-bg);
    transform:translateY(-1px);
  }
  .addbtn:active{transform:scale(.99)}

  /* ---------------- empty state ---------------- */
  .empty{
    padding:56px 24px;
    color:var(--dim2);font-size:13.5px;font-weight:500;
    text-align:center;line-height:1.65;
    border-radius:var(--r-lg);
    border:1px dashed var(--dashed-soft);
    background:var(--surface);
  }

  /* ---------------- modal sheet ---------------- */
  .modal{
    position:fixed;inset:0;z-index:100;
    display:none;align-items:flex-end;justify-content:center;
    background:var(--overlay);
    -webkit-backdrop-filter:blur(10px) saturate(120%);
    backdrop-filter:blur(10px) saturate(120%);
    padding:0;
  }
  .modal.open{display:flex;animation:fadeIn .18s var(--ease)}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  .sheet{
    position:relative;
    width:100%;max-width:540px;max-height:92vh;overflow:auto;
    padding:26px 20px calc(24px + env(safe-area-inset-bottom));
    border-radius:22px 22px 0 0;
    background:linear-gradient(180deg, var(--sheet-a), var(--sheet-b));
    border:1px solid var(--line-2);
    border-bottom:none;
    box-shadow:var(--shadow-3), inset 0 1px 0 var(--sheen-2);
    animation:sheetUp .26s var(--ease);
  }
  @keyframes sheetUp{from{transform:translateY(22px);opacity:.5}to{transform:none;opacity:1}}

  /* grabber */
  .sheet::before{
    content:"";position:absolute;left:50%;top:9px;transform:translateX(-50%);
    width:36px;height:4px;border-radius:99px;
    background:var(--grabber);
  }
  .sheet h2{
    margin:0 0 16px;
    font-size:17px;font-weight:700;
    letter-spacing:-.024em;
  }

  .hint{
    margin:0 0 12px;
    font-size:12.5px;line-height:1.6;
    color:var(--dim2);
  }
  .hint b{color:var(--dim);font-weight:660}
  .hint.count{
    margin-top:10px;margin-bottom:0;
    font-weight:660;color:var(--dim);
    font-variant-numeric:tabular-nums;
  }

  /* ---------------- footer ---------------- */
  .foot{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;flex-wrap:wrap;
    margin-top:30px;padding-top:16px;
    border-top:1px solid var(--hairline);
  }
  .foot span{font-size:11.5px;color:var(--dim2);letter-spacing:.005em}
  .foot button{
    background:none;border:none;padding:0;
    color:var(--dim2);font-family:inherit;font-size:11.5px;font-weight:600;
    cursor:pointer;
    border-bottom:1px dotted var(--dotline);
    transition:color .16s var(--ease), border-color .16s var(--ease);
  }
  .foot button:hover{color:var(--txt);border-color:var(--dotline-hover)}

  /* ---------------- focus visibility ---------------- */
  :focus-visible{
    outline:2px solid var(--blue);
    outline-offset:2px;
  }

  /* ---------------- responsive ---------------- */
  @media(max-width:680px){
    .wrap{padding:18px 14px}
    .stats{grid-template-columns:1fr 1fr;gap:9px}
    .stat{padding:13px 13px 12px;border-radius:var(--r)}
    .stat .n{font-size:23px}
    .stat .l{font-size:10px}
    .stat .sub{font-size:11px;margin-top:7px}
    .r-actions{gap:7px}
    button.act{padding:9px 12px;font-size:12.5px}
    .r-sub{gap:14px}
    /* five tabs need tighter spacing before they start scrolling */
    .tab{padding:7px 11px;font-size:12.5px}
    .tab .cnt{margin-left:4px}
    .sortbtn{height:32px;padding:0 10px;font-size:12px}
  }
  @media(max-width:520px){
    .fgrid{grid-template-columns:1fr}
    .addrow{grid-template-columns:1fr}
    header{padding-bottom:16px}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="dot-logo">💪</div>
      <div class="brandtext">
        <h1 id="t-title">Renewal Radar</h1>
        <button class="gymbtn" id="gymBtn" type="button" title="Change gym name">
          <span class="gymname" id="t-gym">Iron House Gym · Camden</span>
          <svg class="gpencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>
          </svg>
        </button>
      </div>
    </div>
    <button class="themebtn" id="themeBtn" type="button" aria-label="Switch theme" title="Switch theme">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.2v2.1M12 19.7v2.1M2.2 12h2.1M19.7 12h2.1M5.1 5.1l1.5 1.5M17.4 17.4l1.5 1.5M18.9 5.1l-1.5 1.5M6.6 17.4l-1.5 1.5"/>
      </svg>
    </button>
  </header>

  <div class="stats">
    <div class="stat red">
      <div class="n" id="s-lapsed">0</div>
      <div class="l" id="t-lapsed">Lapsed</div>
      <div class="sub" id="s-lapsed-money">£0 lost</div>
    </div>
    <div class="stat amber">
      <div class="n" id="s-expiring">0</div>
      <div class="l" id="t-expiring">Expiring in 7 days</div>
      <div class="sub" id="s-expiring-money">£0 at risk</div>
    </div>
    <div class="stat green">
      <div class="n" id="s-renewed">0</div>
      <div class="l" id="t-renewed">Renewed this month</div>
      <div class="sub" id="s-renewed-money">£0 recovered</div>
    </div>
    <div class="stat blue">
      <div class="n" id="s-pt">0</div>
      <div class="l" id="t-pt">PT sessions low</div>
      <div class="sub" id="s-pt-sub">3 or fewer left</div>
    </div>
  </div>

  <div class="filterrow">
    <div class="searchbar" id="searchbar">
      <span class="ic">🔍</span>
      <input id="search" placeholder="Search name or number" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="clr" id="searchClear" aria-label="Clear search">×</button>
    </div>
    <button class="sortbtn" id="sortBtn" type="button" data-mode="urgency"
            aria-label="Sort order" title="Sort order">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path class="up" d="M8 20V5M8 5l-3.2 3.2M8 5l3.2 3.2"/>
        <path class="down" d="M16 4v15M16 19l-3.2-3.2M16 19l3.2-3.2"/>
      </svg>
      <span id="sortLabel">Urgency</span>
    </button>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="list" id="list"></div>

  <div class="addrow">
    <button class="addbtn" id="addOpen">＋ Add member</button>
    <button class="addbtn" id="importOpen">⇪ Import list</button>
  </div>

  <div class="foot">
    <span id="t-demo">Demo data · nothing leaves this browser</span>
    <button id="reset">Reset demo data</button>
  </div>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
/* ---------- i18n ---------- */
const L = {
  en:{
    title:"Renewal Radar",
    lapsed:"Lapsed", expiring:"Expiring in 7 days", renewed:"Renewed this month", pt:"PT sessions low",
    lost:"£{v} lost", risk:"£{v} at risk", recov:"£{v} recovered", ptSub:"3 or fewer left",
    tabAction:"Needs action", tabLapsed:"Lapsed", tabSoon:"Expiring soon", tabAll:"All members",
    tabFlagged:"Flagged",
    addOpen:"＋ Add member", save:"Save member", cancel:"Cancel",
    name:"Name", phone:"WhatsApp number", plan:"Plan", start:"Start date",
    ptTotal:"PT sessions (0 if none)", ptLeft:"PT left",
    wa:"WhatsApp", renew:"Mark renewed", daysLeft:"{d}d left", expired:"Expired {d}d ago",
    expiresToday:"Expires today", never:"No reminder sent yet", reminded:"Last reminded {d}d ago",
    reminderOk:"Reminder sent to {n} ✓", renewedOk:"{n} renewed · {p} added",
    edit:"Edit", markLeft:"Mark as left", del:"Delete", reactivate:"Reactivate", left:"Left",
    flag:"Flag", unflag:"Unflag", flaggedOk:"{n} flagged", unflaggedOk:"{n} unflagged",
    flagHint:"Flag this member to keep an eye on them",
    note:"Note", addNote:"Add note", noteSaved:"Note saved", noteDeleted:"Note removed",
    noteTitle:"Note", noteHint:"Anything worth remembering: why they might leave, what they asked for, who referred them, a promise you made.",
    notePlaceholder:"Wants to cancel — said he'd decide after his trip. Call on the 12th.",
    saveNote:"Save note", deleteNote:"Delete note",
    emptyFlagged:"No flagged members. Tap Flag on anyone you want to keep an eye on.",
    search:"Search name or number",
    noMatch:"No members match your search.",
    emptyAction:"Nothing needs attention. Come back next week.", emptyOther:"No members here.",
    demo:"Demo data · nothing leaves this browser", reset:"Reset demo data",
    gymTitle:"Gym details", gymNameLabel:"Gym name", gymPlaceLabel:"Area / location (optional)",
    gymNamePh:"Iron House Gym", gymPlacePh:"Camden",
    gymHint:"This name appears in every WhatsApp message you send.",
    gymSaved:"Gym name updated", gymRequired:"Enter a gym name",
    msgSoon:"Hi {name}, your {gym} membership expires in {d} days ({date}). Renew your {plan} plan (£{price}) to keep your streak going. Reply here to renew. 💪",
    msgLapsed:"Hi {name}, your {gym} membership expired on {date}. We'd love to have you back — renew this week and we'll add a free week. 💪",
    msgToday:"Hi {name}, your {gym} membership expires today ({date}). Renew your {plan} plan (£{price}) to keep your streak going. 💪"
  }
};
const t = (k, vars) => {
  let s = (L.en[k] ?? k);
  if (vars) for (const key in vars) s = s.replaceAll("{"+key+"}", vars[key]);
  return s;
};
const money = n => "£" + Number(n).toLocaleString("en-GB");

/* UK mobile numbers: stored as 10 digits without the trunk 0 (7700900123) */
const cleanPhone = v => {
  let d = String(v).replace(/\D/g, "");
  if (d.startsWith("44")) d = d.slice(2);
  if (d.startsWith("0"))  d = d.slice(1);
  return d.slice(-10);
};
const prettyPhone = p => p.length === 10 ? `0${p.slice(0,4)} ${p.slice(4)}` : p;
const waPhone     = p => `44${p}`;

/* ---------- plans ---------- */
const PLANS = {
  monthly:   { label:"Monthly",     price:39,  days:30  },
  quarterly: { label:"Quarterly",   price:105, days:90  },
  halfyearly:{ label:"Half-yearly", price:190, days:180 },
  yearly:    { label:"Yearly",      price:349, days:365 }
};
const planLabel = p => PLANS[p].label;

/* Gym name shown in the header and used in every WhatsApp message */
const gymLabel = () => {
  const name  = (state && state.gym)   ? state.gym   : "Iron House Gym";
  const place = (state && state.place) ? state.place : "";
  return place ? `${name} · ${place}` : name;
};

/* ---------- storage ---------- */
const KEY = "rr_gym_v1";
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if (raw){
      const s = JSON.parse(raw);
      s.members  = (s.members  || []).map(m => ({ status:"active", flagged:false, note:"", ...m }));
      s.renewals = s.renewals || [];
      s.gym      = s.gym   || "Iron House Gym";
      if (s.place === undefined) s.place = "Camden";
      return s;
    }
  }catch(e){}
  return seed();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}
function clearDemo(){ try{ localStorage.removeItem(KEY); }catch(e){} }

const iso = d => {                       // local YYYY-MM-DD (toISOString() would shift to UTC)
  const x = new Date(d);
  const p = n => String(n).padStart(2, "0");
  return `${x.getFullYear()}-${p(x.getMonth() + 1)}-${p(x.getDate())}`;
};
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const daysBetween = (a,b) => Math.round((b - a)/86400000);
const fmtDate = s => new Date(s+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function seed(){
  const today = new Date(); today.setHours(0,0,0,0);
  const mk = (name, phone, plan, offsetDays, pt=0, ptLeft=0, remindedAgo=null, flagged=false) => ({
    id: uid(),
    name, phone: cleanPhone(phone), plan,
    expiry: iso(addDays(today, offsetDays)),
    pt, ptLeft,
    lastReminded: remindedAgo === null ? null : iso(addDays(today, -remindedAgo)),
    status: "active",
    flagged,
    note: ""
  });

  const out = {
    gym: "Iron House Gym",
    place: "Camden",
    members: [
      mk("James Whitfield","07700900123","monthly",-4, 12, 2, 6),
      mk("Sarah Bennett","07700900456","quarterly",-11, 0, 0, 3),
      mk("Michael Doyle","07700900789","monthly",3, 8, 5, 2, true),
      mk("Emma Hughes","07700900112","halfyearly",5, 0, 0, null),
      mk("David Clarke","07700900234","monthly",0, 0, 0, null),
      mk("Charlotte Reid","07700900345","yearly",7, 20, 14, null),
      mk("Thomas Ashford","07700900567","monthly",-22, 0, 0, 1),
      mk("Rebecca Lawson","07700900678","quarterly",2, 6, 1, null),
      mk("Daniel Fletcher","07700900890","monthly",19, 0, 0, null),
      mk("Hannah Marsh","07700900901","halfyearly",-2, 10, 3, 9),
      mk("Oliver Grant","07700900934","monthly",12, 0, 0, null),
      mk("Sophie Turner","07700900968","quarterly",45, 0, 0, null, true)
    ],
    renewals: []
  };

  // a couple of notes so the feature is visible on first open
  const setNote = (name, note) => {
    const m = out.members.find(x => x.name === name);
    if (m) m.note = note;
  };
  setNote("Michael Doyle", "Asked about pausing in Nov — travelling for work. Ring him before expiry, he's a referral source.");
  setNote("Sophie Turner", "Referred by Hannah Marsh. Wants a PT package at renewal — quote the 10-session rate.");

  return out;
}

let state = load();

/* ---------- helpers ---------- */
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const dLeft = m => daysBetween(today(), new Date(m.expiry+"T00:00:00"));
const statusOf = m => {
  if (m.status === "left") return "left";
  const d = dLeft(m);
  return d < 0 ? "lapsed" : d <= 7 ? "expiring" : "active";
};
const isActive = m => m.status !== "left";
const priceOf = m => PLANS[m.plan].price;
const ptLow = m => m.pt > 0 && m.ptLeft <= 3;

function msgFor(m){
  const d = dLeft(m);
  const vars = {
    name: m.name.split(" ")[0],
    gym: state.gym,
    d: d,
    date: fmtDate(m.expiry),
    plan: planLabel(m.plan),
    price: money(priceOf(m)).slice(1)
  };
  if (d < 0) return t("msgLapsed", vars);
  if (d === 0) return t("msgToday", vars);
  return t("msgSoon", vars);
}

/* ---------- render ---------- */
let tab = "action";
let query = "";
let sortMode = (function(){
  try{
    const s = localStorage.getItem("rr_sort");
    if (s === "az" || s === "za" || s === "urgency") return s;
  }catch(e){}
  return "urgency";
})();

const TABS = [
  { id:"action",  key:"tabAction"  },
  { id:"lapsed",  key:"tabLapsed"  },
  { id:"soon",    key:"tabSoon"    },
  { id:"flagged", key:"tabFlagged" },
  { id:"all",     key:"tabAll"     }
];

const SORT_LABEL = { urgency:"Urgency", az:"A–Z", za:"Z–A" };
const SORT_CYCLE = { urgency:"az", az:"za", za:"urgency" };

const byName = (a,b) => a.name.localeCompare(b.name, "en", { sensitivity:"base" });

/* Applies the active sort, keeping people who left the gym pinned to the bottom. */
function sortMembers(arr){
  const cmp = sortMode === "az" ? byName
            : sortMode === "za" ? (a,b) => byName(b,a)
            : (a,b) => dLeft(a) - dLeft(b);      // urgency = soonest expiry first

  return arr.sort((a,b) => {
    const al = statusOf(a) === "left", bl = statusOf(b) === "left";
    if (al !== bl) return al ? 1 : -1;
    if (cmp(a,b) !== 0) return cmp(a,b);
    return byName(a,b);                        // stable tie-break
  });
}

function filtered(){
  const q = query.trim().toLowerCase();

  // While searching, always look across everyone — otherwise an active member
  // looks "missing" just because the current tab only shows people needing action.
  if (q){
    const qDigits = q.replace(/\D/g, "");     // "" would match every phone number
    return sortMembers(state.members.filter(m =>
      m.name.toLowerCase().includes(q) ||
      (m.note || "").toLowerCase().includes(q) ||
      (qDigits && (m.phone.includes(qDigits) || prettyPhone(m.phone).includes(q)))
    ));
  }

  // "All members" is the only tab that shows people who have left
  const ms = state.members.filter(m => tab === "all" ? true : isActive(m));

  if (tab === "lapsed")  return sortMembers(ms.filter(m => statusOf(m) === "lapsed"));
  if (tab === "soon")    return sortMembers(ms.filter(m => statusOf(m) === "expiring"));
  if (tab === "flagged") return sortMembers(ms.filter(m => m.flagged));
  if (tab === "all")     return sortMembers(ms);

  // needs action = lapsed + expiring + low PT + anything the owner flagged
  return sortMembers(ms.filter(m =>
    statusOf(m) !== "active" || ptLow(m) || m.flagged
  ));
}

function render(){
  document.getElementById("t-title").textContent = t("title");
  document.getElementById("t-gym").textContent = gymLabel();
  document.getElementById("t-lapsed").textContent = t("lapsed");
  document.getElementById("t-expiring").textContent = t("expiring");
  document.getElementById("t-renewed").textContent = t("renewed");
  document.getElementById("t-pt").textContent = t("pt");
  document.getElementById("s-pt-sub").textContent = t("ptSub");
  document.getElementById("t-demo").textContent = t("demo");
  document.getElementById("reset").textContent = t("reset");
  document.getElementById("addOpen").textContent = t("addOpen");
  document.getElementById("searchbar").classList.toggle("has", !!query);

  const sortBtn = document.getElementById("sortBtn");
  sortBtn.dataset.mode = sortMode;
  document.getElementById("sortLabel").textContent = SORT_LABEL[sortMode];
  const sortHint = `Sorted by ${SORT_LABEL[sortMode]} — tap to change`;
  sortBtn.setAttribute("aria-label", sortHint);
  sortBtn.title = sortHint;

  // stats — people who left the gym don't count as lost money
  const pool    = state.members.filter(isActive);
  const lapsed  = pool.filter(m => statusOf(m)==="lapsed");
  const expiring= pool.filter(m => statusOf(m)==="expiring");
  const lowPt   = pool.filter(ptLow);
  const monthRenewals = state.renewals.filter(r => {
    const d = new Date(r.at); const n = new Date();
    return d.getMonth()===n.getMonth() && d.getFullYear()===n.getFullYear();
  });
  const sum = arr => arr.reduce((a,m)=>a+priceOf(m),0);

  document.getElementById("s-lapsed").textContent  = lapsed.length;
  document.getElementById("s-expiring").textContent= expiring.length;
  document.getElementById("s-renewed").textContent = monthRenewals.length;
  document.getElementById("s-pt").textContent      = lowPt.length;
  document.getElementById("s-lapsed-money").textContent  = t("lost",  {v: sum(lapsed).toLocaleString("en-GB")});
  document.getElementById("s-expiring-money").textContent= t("risk",  {v: sum(expiring).toLocaleString("en-GB")});
  document.getElementById("s-renewed-money").textContent = t("recov", {v: monthRenewals.reduce((a,r)=>a+r.amount,0).toLocaleString("en-GB")});

  // tabs
  const counts = {
    action:  pool.filter(m => statusOf(m)!=="active" || ptLow(m) || m.flagged).length,
    lapsed:  lapsed.length,
    soon:    expiring.length,
    flagged: pool.filter(m => m.flagged).length,
    all:     state.members.length
  };
  document.getElementById("tabs").innerHTML = TABS.map(x =>
    `<button class="tab ${tab===x.id?"active":""}" data-tab="${x.id}">
       ${t(x.key)} <span class="cnt">${counts[x.id]}</span>
     </button>`).join("");

  // list
  const rows = filtered();
  const list = document.getElementById("list");
  if (!rows.length){
    const msg = query.trim() ? t("noMatch")
      : tab === "action"  ? t("emptyAction")
      : tab === "flagged" ? t("emptyFlagged")
      : t("emptyOther");
    list.innerHTML = `<div class="empty">${msg}</div>`;
  } else {
    list.innerHTML = rows.map(m => {
      const st = statusOf(m);
      const d = dLeft(m);
      const gone = st === "left";
      const when = gone ? t("left")
        : d < 0 ? t("expired",{d:Math.abs(d)})
        : d === 0 ? t("expiresToday")
        : t("daysLeft",{d});
      const rem = m.lastReminded
        ? t("reminded",{d: Math.max(0, daysBetween(new Date(m.lastReminded+"T00:00:00"), today()))})
        : t("never");
      const ptPill = m.pt > 0
        ? `<span class="pill pt">PT ${m.ptLeft}/${m.pt}</span>` : "";

      const main = gone ? "" : `
        <div class="r-actions">
          <button class="act wa" data-wa="${m.id}">💬 ${t("wa")}</button>
          <button class="act renew" data-renew="${m.id}">✓ ${t("renew")}</button>
        </div>`;

      const noteBlock = m.note
        ? `<button class="r-note" data-note="${m.id}" title="${t("note")}">
             <span class="nicon" aria-hidden="true">✎</span>
             <span class="ntext">${esc(m.note)}</span>
           </button>`
        : "";

      const secondary = gone
        ? `<button class="mini ${m.note ? "isnote" : ""}" data-note="${m.id}"><span class="npend">✎</span>${m.note ? t("note") : t("addNote")}</button>
           <button class="mini" data-reactivate="${m.id}">${t("reactivate")}</button>
           <button class="mini danger" data-del="${m.id}">${t("del")}</button>`
        : `<button class="mini" data-edit="${m.id}">${t("edit")}</button>
           <button class="mini ${m.flagged ? "isflag" : ""}" data-flag="${m.id}"
                   aria-pressed="${m.flagged}" title="${t("flagHint")}">${
                     m.flagged ? `<span class="mstar">★</span>${t("unflag")}` : `<span class="mstar">☆</span>${t("flag")}`
                   }</button>
           <button class="mini ${m.note ? "isnote" : ""}" data-note="${m.id}"><span class="npend">✎</span>${m.note ? t("note") : t("addNote")}</button>
           <button class="mini" data-left="${m.id}">${t("markLeft")}</button>
           <button class="mini danger" data-del="${m.id}">${t("del")}</button>`;

      return `
      <div class="row ${st}">
        <div class="r-top">
          <div>
            <div class="r-name">${m.flagged ? `<span class="flagstar" aria-label="Flagged">★</span>` : ""}${esc(m.name)}</div>
            <div class="r-meta">
              ${prettyPhone(m.phone)}<span class="sep">·</span>${planLabel(m.plan)}
              <span class="sep">·</span>${money(priceOf(m))}
            </div>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
            ${ptPill}
            <span class="pill ${st}">${when}</span>
          </div>
        </div>
        ${main}
        ${noteBlock}
        <div class="r-rem">${gone ? "" : rem}</div>
        <div class="r-sub">${secondary}</div>
      </div>`;
    }).join("");
  }

  save();
}

/* ---------- theme ---------- */
const THEME_KEY = "rr_theme";
const themeBtn  = document.getElementById("themeBtn");

function setTheme(t, persist){
  document.documentElement.setAttribute("data-theme", t);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", t === "light" ? "#f2f4f8" : "#0a0c10");
  if (themeBtn){
    const going = t === "light" ? "dark" : "light";
    themeBtn.setAttribute("aria-label", `Switch to ${going} theme`);
    themeBtn.title = `Switch to ${going} theme`;
  }
  if (persist){ try{ localStorage.setItem(THEME_KEY, t); }catch(e){} }
}
const currentTheme = () => document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";

if (themeBtn){
  setTheme(currentTheme(), false);              // sync label with the pre-paint value
  themeBtn.onclick = () => {
    setTheme(currentTheme() === "light" ? "dark" : "light", true);
    if (typeof render === "function") render(); // toast styles and rows re-read tokens
  };
}

/* Follow the OS only while the user has never chosen manually. */
if (window.matchMedia){
  const mq = window.matchMedia("(prefers-color-scheme: light)");
  const onChange = e => {
    let stored;
    try{ stored = localStorage.getItem(THEME_KEY); }catch(err){}
    if (stored === "light" || stored === "dark") return;
    setTheme(e.matches ? "light" : "dark", false);
  };
  if (mq.addEventListener) mq.addEventListener("change", onChange);
  else if (mq.addListener) mq.addListener(onChange);
}

/* ---------- toast ---------- */
function toast(msg, bad){
  const el = document.createElement("div");
  el.textContent = msg;
  el.style.cssText = `
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);
    max-width:min(88vw,420px);text-align:center;
    padding:12px 18px;border-radius:12px;
    font-family:inherit;font-size:13.5px;font-weight:660;letter-spacing:-.005em;
    color:${bad ? "var(--red-soft)" : "var(--green-soft)"};
    background:${bad ? "var(--red-bg)" : "var(--green-bg)"};
    border:1px solid ${bad ? "var(--red-line)" : "var(--green-line)"};
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    backdrop-filter:blur(14px) saturate(140%);
    box-shadow:var(--toast-shadow);
    z-index:200;
    opacity:0;transition:opacity .2s cubic-bezier(.22,.68,.32,1), transform .28s cubic-bezier(.22,.68,.32,1);
  `;
  document.body.appendChild(el);
  requestAnimationFrame(()=>{
    el.style.opacity = "1";
    el.style.transform = "translateX(-50%) translateY(0)";
  });
  setTimeout(()=>{
    el.style.opacity = "0";
    el.style.transform = "translateX(-50%) translateY(8px)";
    setTimeout(()=>el.remove(), 260);
  }, 2200);
}

/* ---------- add / edit ---------- */
function openEditor(mode, id){
  const m = id ? state.members.find(x => x.id === id) : null;
  const editing = mode === "edit";

  sheet.innerHTML = `
    <h2>${editing ? "Edit member" : "Add member"}</h2>
    <div class="fgrid">
      <div><label>Name</label>
        <input id="m-name" placeholder="James Whitfield" value="${m ? esc(m.name) : ""}"></div>
      <div><label>WhatsApp number</label>
        <input id="m-phone" inputmode="tel" placeholder="07700 900123" value="${m ? prettyPhone(m.phone) : ""}"></div>
      <div><label>Plan</label>
        <select id="m-plan">
          ${Object.entries(PLANS).map(([k,v]) =>
            `<option value="${k}"${m && m.plan === k ? " selected" : ""}>${v.label} · ${money(v.price)}</option>`
          ).join("")}
        </select></div>
      <div><label>${editing ? "Expiry date" : "Start date"}</label>
        <input id="m-date" type="date" value="${m ? m.expiry : iso(today())}"></div>
      <div><label>PT sessions (0 if none)</label>
        <input id="m-pt" type="number" min="0" value="${m ? m.pt : 0}"></div>
      <div><label>PT left</label>
        <input id="m-ptleft" type="number" min="0" value="${m ? m.ptLeft : 0}"></div>
    </div>
    <button class="fsave" id="m-save">${editing ? "Save changes" : "Save member"}</button>
    <button class="fclose" id="m-cancel">Cancel</button>
  `;

  modal.classList.add("open");
  document.getElementById("m-name").focus();
  document.getElementById("m-cancel").onclick = closeModal;

  document.getElementById("m-save").onclick = () => {
    const name  = document.getElementById("m-name").value.trim();
    const phone = cleanPhone(document.getElementById("m-phone").value);
    if (!name){ toast("Enter a name", true); return; }
    if (phone.length !== 10){ toast("Enter a UK mobile number", true); return; }

    const plan  = document.getElementById("m-plan").value;
    const date  = document.getElementById("m-date").value || iso(today());
    const pt    = Math.max(0, parseInt(document.getElementById("m-pt").value || "0", 10));
    const ptLeft= Math.min(pt, Math.max(0, parseInt(document.getElementById("m-ptleft").value || "0", 10)));

    if (!editing){
      state.members.push({
        id: uid(), name, phone, plan,
        expiry: iso(addDays(new Date(date+"T00:00:00"), PLANS[plan].days)),
        pt, ptLeft, lastReminded: null, status: "active", flagged: false, note: ""
      });
      toast(`${name.split(" ")[0]} added`);
    } else {
      m.name = name; m.phone = phone; m.plan = plan;
      m.expiry = date; m.pt = pt; m.ptLeft = ptLeft;
      if (dLeft(m) >= 0) m.lastReminded = null;   // renewal resets reminder history
      toast("Changes saved");
    }
    closeModal(); render();
  };
}

/* ---------- gym name ---------- */
function openGymEditor(){
  sheet.innerHTML = `
    <h2>${t("gymTitle")}</h2>
    <p class="hint">${t("gymHint")}</p>
    <div class="fgrid">
      <div style="grid-column:1/-1"><label>${t("gymNameLabel")}</label>
        <input id="g-name" autocomplete="off" placeholder="${esc(t("gymNamePh"))}" value="${esc(state.gym || "")}"></div>
      <div style="grid-column:1/-1"><label>${t("gymPlaceLabel")}</label>
        <input id="g-place" autocomplete="off" placeholder="${esc(t("gymPlacePh"))}" value="${esc(state.place || "")}"></div>
    </div>
    <button class="fsave" id="g-save">Save</button>
    <button class="fclose" id="g-cancel">Cancel</button>
  `;

  modal.classList.add("open");
  const nameEl = document.getElementById("g-name");
  nameEl.focus();
  nameEl.select();

  const commit = () => {
    const name = nameEl.value.trim();
    if (!name){ toast(t("gymRequired"), true); nameEl.focus(); return false; }
    state.gym   = name;
    state.place = document.getElementById("g-place").value.trim();
    save(); closeModal(); render();
    toast(t("gymSaved"));
    return true;
  };

  document.getElementById("g-save").onclick = commit;
  document.getElementById("g-cancel").onclick = closeModal;

  const placeEl = document.getElementById("g-place");
  [nameEl, placeEl].forEach(el => el.addEventListener("keydown", e => {
    if (e.key === "Enter"){ e.preventDefault(); commit(); }
  }));
}

/* ---------- notes ---------- */
function openNote(id){
  const m = state.members.find(x => x.id === id);
  if (!m) return;

  sheet.innerHTML = `
    <h2>${t("note")} — ${esc(m.name)}</h2>
    <p class="hint">${t("noteHint")}</p>
    <textarea id="note-text" class="note-area" placeholder="${esc(t("notePlaceholder"))}">${esc(m.note || "")}</textarea>
    <button class="fsave" id="note-save">${t("saveNote")}</button>
    ${m.note ? `<button class="fclose danger" id="note-del">${t("deleteNote")}</button>` : ""}
    <button class="fclose" id="note-cancel">Cancel</button>
  `;

  modal.classList.add("open");
  const ta = document.getElementById("note-text");
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);

  const commit = () => {
    m.note = ta.value.trim();
    save(); closeModal(); render();
  };

  document.getElementById("note-save").onclick = () => {
    const had = !!m.note;
    commit();
    const now = !!m.note;
    if (now) toast(t("noteSaved"));
    else if (had) toast(t("noteDeleted"));
  };

  document.getElementById("note-cancel").onclick = closeModal;

  const del = document.getElementById("note-del");
  if (del) del.onclick = () => { m.note = ""; save(); closeModal(); render(); toast(t("noteDeleted")); };

  // Ctrl / Cmd + Enter saves
  ta.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)){ e.preventDefault(); commit(); }
  });
}

/* ---------- bulk import ---------- */
function openImport(){
  sheet.innerHTML = `
    <h2>Import member list</h2>
    <p class="hint">One member per line: <b>Name, Phone, Plan, Start date</b>.
      Only name and phone are required. Plan defaults to <b>monthly</b>; leave the date blank to start today.</p>
    <textarea id="imp-text" spellcheck="false" placeholder="James Whitfield, 07700 900123, monthly
Sarah Bennett, 07700 900456, quarterly, 2026-08-15
Michael Doyle, 07700 900789"></textarea>
    <p class="hint count" id="imp-count">0 members detected</p>
    <button class="fsave" id="imp-save">Import members</button>
    <button class="fclose" id="imp-cancel">Cancel</button>
  `;
  modal.classList.add("open");

  const ta = document.getElementById("imp-text");
  const countEl = document.getElementById("imp-count");

  const parse = () => ta.value.split(/\r?\n/).map(l => l.trim()).filter(Boolean)
    .map(l => l.split(/[,\t;]/).map(s => s.trim()))
    .filter(r => r[0] && cleanPhone(r[1]).length === 10);

  const upd = () => {
    const n = parse().length;
    countEl.textContent = `${n} member${n === 1 ? "" : "s"} detected`;
    countEl.style.color = n ? "var(--green)" : "var(--dim2)";
  };
  ta.addEventListener("input", upd);
  ta.focus();

  document.getElementById("imp-cancel").onclick = closeModal;
  document.getElementById("imp-save").onclick = () => {
    const rows = parse();
    if (!rows.length){ toast("No valid lines — check name and 10-digit number", true); return; }
    rows.forEach(([name, phone, planRaw, dateRaw]) => {
      const raw   = (planRaw || "").toLowerCase().replace(/[^a-z]/g, "");
      const plan  = PLANS[raw] ? raw : "monthly";
      const start = /^\d{4}-\d{2}-\d{2}$/.test(dateRaw || "") ? dateRaw : iso(today());
      state.members.push({
        id: uid(), name, phone: cleanPhone(phone), plan,
        expiry: iso(addDays(new Date(start+"T00:00:00"), PLANS[plan].days)),
        pt: 0, ptLeft: 0, lastReminded: null, status: "active", flagged: false, note: ""
      });
    });
    closeModal(); render();
    toast(`${rows.length} member${rows.length === 1 ? "" : "s"} imported`);
  };
}

/* ---------- list actions ---------- */
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]");
  if (!b) return;
  tab = b.dataset.tab;
  render();
});

document.getElementById("list").addEventListener("click", e => {
  const hit = sel => e.target.closest(sel);

  const wa  = hit("[data-wa]");
  const rn  = hit("[data-renew]");
  const ed  = hit("[data-edit]");
  const fg  = hit("[data-flag]");
  const nt  = hit("[data-note]");
  const lf  = hit("[data-left]");
  const rc  = hit("[data-reactivate]");
  const dl  = hit("[data-del]");

  if (wa){
    const m = state.members.find(x => x.id === wa.dataset.wa);
    window.open(`https://wa.me/${waPhone(m.phone)}?text=${encodeURIComponent(msgFor(m))}`, "_blank");
    m.lastReminded = iso(today());
    save(); render();
    toast(t("reminderOk",{n:m.name.split(" ")[0]}));
    return;
  }

  if (rn){
    const m = state.members.find(x => x.id === rn.dataset.renew);
    const plan = PLANS[m.plan];
    m.expiry = iso(addDays(new Date(m.expiry+"T00:00:00"), plan.days));
    if (m.pt > 0) m.ptLeft = m.pt;
    m.lastReminded = null;
    state.renewals.push({ at: new Date().toISOString(), amount: plan.price, name: m.name });
    save(); render();
    toast(t("renewedOk",{n:m.name.split(" ")[0], p:money(plan.price)}));
    return;
  }

  if (ed){ openEditor("edit", ed.dataset.edit); return; }

  if (fg){
    const m = state.members.find(x => x.id === fg.dataset.flag);
    m.flagged = !m.flagged;
    save(); render();
    toast(t(m.flagged ? "flaggedOk" : "unflaggedOk", {n: m.name.split(" ")[0]}));
    return;
  }

  if (nt){ openNote(nt.dataset.note); return; }

  if (lf){
    const m = state.members.find(x => x.id === lf.dataset.left);
    if (!confirm(`Mark ${m.name} as left the gym?\n\nThey will stop appearing in your lists and won't count towards money at risk.`)) return;
    m.status = "left";
    save(); render();
    toast(`${m.name.split(" ")[0]} marked as left`);
    return;
  }

  if (rc){
    const m = state.members.find(x => x.id === rc.dataset.reactivate);
    m.status = "active";
    save(); render();
    toast(`${m.name.split(" ")[0]} reactivated`);
    return;
  }

  if (dl){
    const m = state.members.find(x => x.id === dl.dataset.del);
    if (!confirm(`Delete ${m.name} permanently?\n\nThis cannot be undone. Use "Mark as left" if they might come back.`)) return;
    state.members = state.members.filter(x => x.id !== m.id);
    save(); render();
    toast(`${m.name.split(" ")[0]} deleted`);
    return;
  }
});

};

/* ---------- sort ---------- */
document.getElementById("sortBtn").onclick = () => {
  sortMode = SORT_CYCLE[sortMode];
  try{ localStorage.setItem("rr_sort", sortMode); }catch(e){}
  render();
};

/* ---------- buttons ---------- */
document.getElementById("addOpen").onclick    = () => openEditor("add");
document.getElementById("importOpen").onclick = openImport;
document.getElementById("gymBtn").onclick     = openGymEditor;
document.getElementById("reset").onclick = () => {
  if (!confirm("Reset demo data?")) return;
  clearDemo(); state = seed(); query = ""; searchEl.value = ""; tab = "action"; render();
};

render();
</script>
</body>
</html>
